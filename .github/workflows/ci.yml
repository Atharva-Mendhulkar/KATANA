name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Scope Guard Check
        run: bash scripts/check-scope.sh bpf
      - name: Run Test Suite
        run: cargo test --verbose

  container-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Container Image & Run Clean Verification
        run: bash scripts/run-e2e-container.sh
